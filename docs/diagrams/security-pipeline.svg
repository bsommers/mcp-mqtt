<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Security pipeline</title><desc id="d">Outbound guards: config, read-only, rate limit, topic rules, allowlist, caps. Inbound: filter cover, receive cap, untrusted rendering, bounds</desc>
