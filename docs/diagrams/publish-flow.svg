<text x="598.0" y="154" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">topic_matches()</text>
<text x="598.0" y="171" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">MQTT_PUBLISH_ALLOW</text>
<text x="598.0" y="188" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">empty = deny all</text>
<path d="M458 166H502" fill="none" stroke="#00e5ff" stroke-width="2" marker-end="url(#ac)" filter="url(#glowS)"/>
