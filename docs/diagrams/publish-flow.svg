<text x="362.0" y="188" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">256 B, 16 levels</text>
<path d="M222 166H266" fill="none" stroke="#00e5ff" stroke-width="2" marker-end="url(#ac)" filter="url(#glowS)"/>
<rect x="504" y="110" width="188" height="112" fill="#0b1428" fill-opacity="0.92" stroke="#ff8a00" stroke-width="1.5" filter="url(#glowS)"/>
<path d="M504 118V110H512M684 110H692V118M504 214V222H512M684 222H692V214" fill="none" stroke="#ff8a00" stroke-width="2"/>
