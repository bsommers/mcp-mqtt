<text x="362.0" y="154" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">validate_publish_topic</text>
