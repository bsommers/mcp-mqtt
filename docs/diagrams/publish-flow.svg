<text x="834.0" y="154" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">validate_qos 0..max_qos</text>
<text x="834.0" y="171" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">default max_qos = 1</text>
<text x="834.0" y="188" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">retain: ALLOW_RETAIN</text>
<path d="M694 166H738" fill="none" stroke="#00e5ff" stroke-width="2" marker-end="url(#ac)" filter="url(#glowS)"/>
<rect x="976" y="110" width="188" height="112" fill="#0b1428" fill-opacity="0.92" stroke="#ff8a00" stroke-width="1.5" filter="url(#glowS)"/>
<path d="M976 118V110H984M1156 110H1164V118M976 214V222H984M1156 222H1164V214" fill="none" stroke="#ff8a00" stroke-width="2"/>
<text x="1070.0" y="132" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff8a00" text-anchor="middle">5 payload</text>
<text x="1070.0" y="154" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">encode_publish_payload</text>
<text x="1070.0" y="171" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">utf8 | base64</text>
<text x="1070.0" y="188" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">cap 65,536 B decoded</text>
