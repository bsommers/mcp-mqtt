<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">Publish flow</title><desc id="d">mqtt_publish passes rate limit, topic, allowlist, qos and retain, payload checks, then publishes via a short-lived paho connection</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04070f"/><stop offset="0.5" stop-color="#081022"/><stop offset="1" stop-color="#040814"/></linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.22"/><stop offset="1" stop-color="#050811" stop-opacity="0"/></radialGradient>
<pattern id="g1" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.10"/></pattern>
<pattern id="g2" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="96" fill="url(#g1)"/><path d="M96 0H0V96" fill="none" stroke="#00e5ff" stroke-width="0.9" stroke-opacity="0.18"/><circle r="1.6" fill="#00e5ff" fill-opacity="0.35"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#00e5ff"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ff8a00"/></marker>
</defs>
<rect width="1200" height="470" rx="0" fill="url(#bg)"/><rect width="1200" height="470" rx="0" fill="url(#g2)"/>
<path d="M10 28V10H28M1172 10H1190V28M10 442V460H28M1172 460H1190V442" fill="none" stroke="#00e5ff" stroke-width="2"/>
<text x="32" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc" text-anchor="start">publish flow: mqtt_publish</text>
<text x="32" y="68" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">every step must pass or the call returns {"ok": false, "error": ...}</text>
<path d="M32 80H1168" stroke="#00e5ff" stroke-opacity="0.3"/>
<rect x="32" y="110" width="188" height="112" fill="#0b1428" fill-opacity="0.92" stroke="#ff8a00" stroke-width="1.5" filter="url(#glowS)"/>
<path d="M32 118V110H40M212 110H220V118M32 214V222H40M212 222H220V214" fill="none" stroke="#ff8a00" stroke-width="2"/>
