<text x="126.0" y="154" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">RateLimiter.check()</text>
<text x="126.0" y="171" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">token bucket</text>
<text x="126.0" y="188" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">60 calls/min</text>
<rect x="268" y="110" width="188" height="112" fill="#0b1428" fill-opacity="0.92" stroke="#ff8a00" stroke-width="1.5" filter="url(#glowS)"/>
<path d="M268 118V110H276M448 110H456V118M268 214V222H276M448 222H456V214" fill="none" stroke="#ff8a00" stroke-width="2"/>
