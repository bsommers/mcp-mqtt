<text x="475.0" y="334" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="middle">Mosquitto / EMQX / NanoMQ</text>
<text x="475.0" y="351" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">QoS 0 or 1 delivery</text>
