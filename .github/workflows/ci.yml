name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.8.17"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Sync dependencies (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy src --strict
      - name: Unit tests with coverage gate
        run: uv run --frozen pytest -m "not integration" --cov=src/mcp_mqtt --cov-branch --cov-fail-under=85
      - name: Dependency audit
        run: uv run --frozen pip-audit
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Sync dependencies (locked)
        run: uv sync --frozen
      - name: Generate throwaway EMQX test key
        run: ./docker/init-test-env.sh > /dev/null
      - name: Start test brokers
        run: docker compose -f docker/docker-compose.yml up -d --wait
      - name: Integration tests
        run: |
          eval "$(./docker/init-test-env.sh)"
          uv run --frozen pytest -m integration
      - name: Stop test brokers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
