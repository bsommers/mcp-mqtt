name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.8.17"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"
      - name: Sync dependencies (locked)
        run: python3 -m uv sync --frozen
      - name: Lint
        run: python3 -m uv run --frozen ruff check .
      - name: Type check
        run: python3 -m uv run --frozen mypy src --strict
      - name: Unit tests with coverage gate
        run: python3 -m uv run --frozen pytest -m "not integration" --cov=src/mcp_mqtt --cov-branch --cov-fail-under=85
      - name: Dependency audit
        run: python3 -m uv run --frozen pip-audit
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"
      - name: Sync dependencies (locked)
        run: python3 -m uv sync --frozen
      - name: Start test brokers
        run: docker compose -f docker/docker-compose.yml up -d --wait
      - name: Integration tests
        run: python3 -m uv run --frozen pytest -m integration
      - name: Stop test brokers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
