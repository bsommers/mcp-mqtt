[project]
name = "mcp-mqtt"
version = "0.1.0"
description = "Hardened MCP servers for Mosquitto, EMQX and NanoMQ MQTT brokers (publish/subscribe)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bill Sommers" }]
keywords = ["mcp", "mqtt", "mosquitto", "emqx", "nanomq", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["mcp>=1.2,<2", "paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
# REST management helpers for the EMQX / NanoMQ profiles (Mosquitto needs neither)
emqx = ["httpx>=0.27,<1"]
nanomq = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/bsommers/mcp-mqtt"
Repository = "https://github.com/bsommers/mcp-mqtt"
Changelog = "https://github.com/bsommers/mcp-mqtt/blob/main/CHANGELOG.md"
Issues = "https://github.com/bsommers/mcp-mqtt/issues"

[project.scripts]
mcp-mosquitto = "mcp_mqtt.brokers.mosquitto:main"
mcp-emqx = "mcp_mqtt.brokers.emqx:main"
mcp-nanomq = "mcp_mqtt.brokers.nanomq:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "mypy", "pytest-cov", "pip-audit", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mqtt"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "T20", "S", "B"]   # T20 bans print() (stdout is JSON-RPC only, MCP-008)
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017"]
"examples/*" = ["T20", "S101"]
"scripts/*" = ["T20", "E501", "S101", "S108", "S314", "S603", "S607", "S602"]

[tool.pytest.ini_options]
markers = ["integration: needs docker brokers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 85
